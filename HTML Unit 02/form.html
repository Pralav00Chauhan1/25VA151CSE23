<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML form</title>
</head>
<body>
   <form action="">
<fieldset>
    <legend align="center">HTML Form</legend>
    
    <label for="">Your Name</label>
    <input type="text" name="" id="" placeholder="enter your name" required/>
    <br/><br/>

    <label for="">Your Contact</label>
    <input type="tel"  maxlength="10" minlength="10" id="" placeholder="enter your contact no." required/>
    <br/><br/>

    <label for="">Your Email</label>
    <input type="email" name="" id="" placeholder="enter your email" required>
    <br/><br/>

<label for="">Your age</label>
<input type="number" name="" id="" placeholder="enter your age" required/>
<br/><br/>

<label for="">Your D.O.B</label>
<input type="date" name="" id="">
<br/><br/>

<label for="">your gender</label>
<input type="radio"  name="gender" id="" />male
<input type="radio"  name="gender" id="" />female
<input type="radio" name="gender" id=""/>other
<br/><br/>

<label for="">your branch</label>
<select name="" id="">
    <option value="CSE">CSE</option>
    <option value="AIML">AIML</option>
    <option value="ECE">ECE</option>
</select>
<br/><br/>

<label for="">your subjects</label>
<input type="checkbox" name="" id=""/>maths
<input type="checkbox" name="" id=""/>physics
<input type="checkbox" name="" id=""/>ds
<input type="checkbox" name="" id=""/>wd
<br/><br/>

<label for="">your distance</label>
<input type="range" name="" id=""  min="0" max="100" />
<br/><br/>

<label for="">your address</label>
<textarea name="" id=""  placeholder="enter your address"></textarea>
<br/><br/>

<label for="">attach file</label>
<input type="file" name="" id=""/>
<br/><br/>

<input list="browsers" placeholder="enter your browsers"/>
<datalist id="browsers">    
    <option value="chrome"/>
    <option value="firefox"/>
    <option value="safari"/>
    <option value="opera"/>
    <option value="edge"/>
</datalist>
<br/><br/>
<input type="submit" value="submit"/>
<input type="reset" value="reset"/>

</fieldset>
</form>
    
</body>
</html>
