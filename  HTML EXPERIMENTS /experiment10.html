<!DOCTYPE html>
<html>
<head>
    <title>Responsive E-commerce Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }
        .navbar {
            background: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .menu {
            display: flex;
            gap: 20px;
        }
        .menu a {
            color: white;
            text-decoration: none;
        }
        @media (max-width: 600px) {
            .menu {
                display: none;
            }
            .menu-btn {
                display: block;
                font-size: 25px;
                cursor: pointer;
            }
        }
        #toggle:checked + .menu {
            display: flex;
            flex-direction: column;
            background: #333;
            padding: 15px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <div class="logo">MyShop</div>
    <label for="toggle" class="menu-btn">☰</label>
    <input type="checkbox" id="toggle" hidden>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
    </div>
</div>
</body>
</html>
