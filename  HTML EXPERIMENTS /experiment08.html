<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile</title>
    <style>
        body{
            margin: 0;
            padding: 0;
        }
        html,*{
            margin: 0;
            padding: 0;
        }
        main{
            width: 1000px;
            height: 300px;
            border: 1px solid #000;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: row;
            gap:0 40px;
        }
         .box{
            flex-grow: 1 ;
            height: 280px;
            box-shadow:1px 1px 5px #999 ;
            padding: 10px;
            background-color: antiquewhite;
         }
         h2{
            text-align: center;
            line-height: 100px;
         }
         h3{
            text-align: center;
            line-height: 30px;
            margin-top: 30px;
         }
         .name{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(12, 171, 239);
             margin: 0 auto;
         }
         p{
            text-align: center;
            line-height: 25px;
         }
        
</style>
</head>
<body>
    <main>

        <div class="box">
            <div class="name"><h2>JK</h2></div>
            <h3>Jeet Kumar</h3>
            <p>B.Tech-CSE</p>
            <p>Roll No:21CS1007</p>
            <p>1st year</p>
        </div>

        <div class="box">
            <div class="name"><h2>AR</h2></div>
            <h3>Asha Rani</h3>
            <p>B.Tech-IT</p>
            <p>Roll No:21IT1012</p>
            <p>1st year</p>

        </div>

        <div class="box">
            <div class="name"><h2>RK</h2></div>
            <h3>Rohit Kumar</h3>
            <p>B.Tech-ECE</p>
            <p>Roll No:21EC1009</p>
            <p>1st year</p>
        </div>

    </main>
    
</body>
</html>
