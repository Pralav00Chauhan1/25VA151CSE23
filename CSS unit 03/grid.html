<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grids</title>
    <style>
        html,*{
            margin: 1px;
            padding:0px;
            box-sizing: border-box;
        }
         main{
            display: grid;
            /* grid-template-columns: repeat(4,1fr); */
            /* grid-template-rows:  auto 200px auto 200px  320px  ; */
            grid-template-rows:  120px 130px  220px 160px 160px  ;
            gap: 10px;

         }
         .box{
            background-color: rgb(231, 237, 235);
            /* height: 100px; */
            gap: 10px;
            align-content: center;
        
         }
         .section{
             
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 5px;
         }
         #left{
            
            display: grid;
            grid-template-rows: auto ;
            gap: 5px;;
         }
         #upper{
            background-color: rgb(117, 189, 231);
         }
         #lower{
            background-color: rgb(27, 203, 212);
         }
         #right{
            background-color: rgb(84, 206, 204);
             
         }

          
         
    </style>
</head>
<body> 
     <main>
         <div class="box"> <h2>Header</h2></div>
         <div class="box"><h2>Nav</h2></div>
         <div class="section"> 
            <div id="left">
                <div id="upper"><h2>Title</h2></div>
                <div id="lower"><h2>Details</h2></div>
            </div>



            <div id="right"><h2>Right</h2></div>
         </div>
         <div class="box"><h2>Article</h2></div>
         <div class="box"><h2>Footer</h2></div>
     </main>
</body>
</html>
