<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS:Display</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            width:900px;
            height: auto;
            margin: 0 auto;
            margin-right: auto ;
            margin-left: auto ;
            background-color: antiquewhite;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap:10px 10px;
            align-content: space-between;
            /*align-items:last baseline ; */

             
        }
        .box{
            flex-grow:1;
            /*width: 200px;*/
            height: 200px;
            background-color: #999;
            margin-top: 58px;
            margin-left: 10px;
            margin-right: 10px;
            margin-bottom: 58px;
             
             
        }
    </style>
</head>
<body>
    <main>
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
    </main>
</body>
</html>
